name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # AJOUT INDISPENSABLE : Donne l'autorisation à GitHub de s'authentifier auprès de NuGet
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ArcadeShareServer.sln

    - name: Build SDK
      run: dotnet build ArcadeShareServer.sln --configuration Release --no-restore

    - name: Pack SDK
      run: dotnet pack src/Audio_Arcade_SDK/Audio_Arcade_SDK.csproj --configuration Release --no-build --output nupkgs

    - name: Push to NuGet
      # MODIFICATION : On n'utilise plus ${{ secrets.NUGET_API_KEY }} car la connexion est automatique !
      run: dotnet nuget push "nupkgs/*.nupkg" --source https://nuget.org --skip-duplicate
