name: Publish to NuGet

on:
  release:
    types: [published]
    workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ArcadeShareServer.sln

    - name: Build SDK
      run: dotnet build ArcadeShareServer.sln --configuration Release --no-restore

    - name: Pack SDK
      run: dotnet pack ArcadeShareServer.csproj --configuration Release --no-build --output nupkgs

    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: La_TNT

    - name: Push to NuGet
      run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
